name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Temporarily remove this
          # - platform: "macos-latest" # Apple Silicon
          #   args: "--target aarch64-apple-darwin"
          # - platform: "macos-latest" # Intel
          #   args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "application/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci
      # - name: Clean previous bundle output (Linux)
      #   if: matrix.platform == 'ubuntu-22.04'
      #   run: rm -rf src-tauri/target/release/bundle

      - name: Clean previous bundle output (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Remove-Item -Recurse -Force src-tauri\target\release\bundle -ErrorAction SilentlyContinue

      # Build the Tauri app (no GitHub Release)
      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_HELP_RELEASE_URL: ${{ secrets.VITE_HELP_RELEASE_URL }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Debug - list bundle contents
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse | Select-Object FullName

      - name: Generate latest.json
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "*-setup.exe" } | Select-Object -First 1
          $sig = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.sig" | Select-Object -First 1

          if (-not $exe) { throw "setup.exe not found" }
          if (-not $sig) { throw ".sig not found" }

          $signature = Get-Content $sig.FullName -Raw
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          # NOTE: SUPABASE_URL secret must be the public project URL (no trailing slash),
          # matching the /storage/v1/object/public/... path used by the client updater config
          $publicUrl = "$env:SUPABASE_URL/storage/v1/object/public/releases/$($exe.Name)"

          $latest = @{
              version   = "v$version"
              notes     = "See the release for details."
              pub_date  = $pubDate
              platforms = @{
                  "windows-x86_64" = @{
                      signature = $signature.Trim()
                      url       = $publicUrl
                  }
              }
          }

          $latest | ConvertTo-Json -Depth 5 | Out-File -FilePath "src-tauri/target/release/bundle/nsis/latest.json" -Encoding utf8

          Write-Host "Generated latest.json at src-tauri/target/release/bundle/nsis/latest.json"

      # Upload ONLY the Windows updater artifacts to Supabase
      - name: Upload updater artifacts to Supabase
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Find generated files
          $latestJson = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "latest.json" | Select-Object -First 1
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "*-setup.exe" } | Select-Object -First 1
          $sig = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.sig" | Select-Object -First 1

          if (-not $latestJson) { throw "latest.json not found" }
          if (-not $exe) { throw "setup.exe not found" }
          if (-not $sig) { throw ".sig not found" }

          Write-Host "Found latest.json: $($latestJson.FullName)"
          Write-Host "Found exe: $($exe.Name)"
          Write-Host "Found sig: $($sig.Name)"

          $response = curl.exe -sS -f -X POST "$env:SUPABASE_URL/storage/v1/object/releases/latest.json" `
            -H "Authorization: Bearer $env:SUPABASE_SERVICE_ROLE_KEY" `
            -H "x-upsert: true" `
            --data-binary "@$($latestJson.FullName)"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload latest.json to Supabase (curl exit $LASTEXITCODE)"
          }

          # Upload installer
          curl.exe -X POST "$env:SUPABASE_URL/storage/v1/object/releases/$($exe.Name)" `
            -H "Authorization: Bearer $env:SUPABASE_SERVICE_ROLE_KEY" `
            -H "x-upsert: true" `
            --data-binary "@$($exe.FullName)"

          # Upload signature
          curl.exe -X POST "$env:SUPABASE_URL/storage/v1/object/releases/$($sig.Name)" `
            -H "Authorization: Bearer $env:SUPABASE_SERVICE_ROLE_KEY" `
            -H "x-upsert: true" `
            --data-binary "@$($sig.FullName)"

          Write-Host "Uploaded updater artifacts to Supabase successfully"

      - name: Upload Linux Assets
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            application/src-tauri/target/release/bundle/**/*.AppImage
            application/src-tauri/target/release/bundle/**/*.deb
          fail_on_unmatched_files: false
