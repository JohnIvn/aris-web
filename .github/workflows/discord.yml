name: Discord Notification

on:
  push:
  pull_request:
  release:

jobs:
  discord:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |

          JSON=$(jq -n \
            --arg title "GitHub Event: $GITHUB_EVENT_NAME" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg user "$GITHUB_ACTOR" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            --arg time "$(date -u)" \
            '{
              embeds: [{
                title: $title,
                color: 5793266,
                fields: [
                  {
                    name: "Repository",
                    value: $repo,
                    inline: true
                  },
                  {
                    name: "User",
                    value: $user,
                    inline: true
                  },
                  {
                    name: "Branch",
                    value: $branch,
                    inline: true
                  },
                  {
                    name: "Commit SHA",
                    value: $sha,
                    inline: false
                  },
                  {
                    name: "Commit Message",
                    value: $message,
                    inline: false
                  },
                  {
                    name: "Commit URL",
                    value: $url,
                    inline: false
                  },
                  {
                    name: "Time",
                    value: $time,
                    inline: false
                  }
                ]
              }]
            }')

          curl \
          -H "Content-Type: application/json" \
          -d "$JSON" \
          "$DISCORD_WEBHOOK"

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Send Release message
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |

          JSON=$(jq -n \
            --arg title "GitHub Event: release" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg user "$GITHUB_ACTOR" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg release "${{ github.event.release.tag_name }}" \
            --arg notes "${{ github.event.release.body }}" \
            --arg url "${{ github.event.release.html_url }}" \
            --arg time "$(date -u)" \
            '{
              embeds: [{
                title: $title,
                color: 10181046,
                fields: [
                  {
                    name: "Repository",
                    value: $repo,
                    inline: true
                  },
                  {
                    name: "User",
                    value: $user,
                    inline: true
                  },
                  {
                    name: "Branch",
                    value: $branch,
                    inline: true
                  },
                  {
                    name: "Release",
                    value: $release,
                    inline: false
                  },
                  {
                    name: "Release Notes",
                    value: $notes,
                    inline: false
                  },
                  {
                    name: "Release URL",
                    value: $url,
                    inline: false
                  },
                  {
                    name: "Time",
                    value: $time,
                    inline: false
                  }
                ]
              }]
            }')

          curl \
          -H "Content-Type: application/json" \
          -d "$JSON" \
          "$DISCORD_RELEASE_WEBHOOK"

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect sensitive files
        id: scan
        run: |
          FOUND=$(git ls-tree -r HEAD --name-only | grep -E "node_modules|\.env|\.pem|\.key|secret|password" || true)

          if [ -n "$FOUND" ]; then
            echo "detected=true" >> $GITHUB_OUTPUT
            echo "$FOUND" > detected.txt
          else
            echo "detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Security Alert
        if: steps.scan.outputs.detected == 'true'
        env:
          DISCORD_SECURITY_WEBHOOK: ${{ secrets.DISCORD_SECURITY_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |

          FILES=$(cat detected.txt)

          JSON=$(jq -n \
            --arg title "GitHub Event: security" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg user "$GITHUB_ACTOR" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg files "$FILES" \
            --arg sha "$GITHUB_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            --arg time "$(date -u)" \
            '{
              embeds: [{
                title: $title,
                color: 16711680,
                fields: [
                  {
                    name: "Repository",
                    value: $repo,
                    inline: true
                  },
                  {
                    name: "User",
                    value: $user,
                    inline: true
                  },
                  {
                    name: "Branch",
                    value: $branch,
                    inline: true
                  },
                  {
                    name: "Detected Files",
                    value: $files,
                    inline: false
                  },
                  {
                    name: "Commit SHA",
                    value: $sha,
                    inline: false
                  },
                  {
                    name: "Commit Message",
                    value: $message,
                    inline: false
                  },
                  {
                    name: "Commit URL",
                    value: $url,
                    inline: false
                  },
                  {
                    name: "Time",
                    value: $time,
                    inline: false
                  }
                ]
              }]
            }')

          curl \
          -H "Content-Type: application/json" \
          -d "$JSON" \
          "$DISCORD_SECURITY_WEBHOOK"
